<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fc">
    <meta name="description" content="VIPRPG 服务状态与关键依赖可用性">
    <title>服务状态 · VIPRPG.org</title>
    <link rel="stylesheet" href="/status.css">
    <script src="/status.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <div class="identity">
          <span class="brand-mark" aria-hidden="true">V</span>
          <div>
            <div class="brand-name">VIPRPG<span>.</span>ORG</div>
            <div class="brand-subtitle">服务状态</div>
          </div>
        </div>
        <nav class="site-nav" aria-label="页面导航">
          <a href="#services">服务概览</a>
          <a href="#incidents">历史事件</a>
          <span class="nav-divider" aria-hidden="true"></span>
          <a href="https://staging.viprpg.org/">返回档案站 ↗</a>
        </nav>
      </header>

      <main>
        <div class="page-intro">
          <div>
            <p class="eyebrow">VIPRPG SERVICE STATUS</p>
            <h1>运行状态</h1>
            <p class="intro-copy">查看档案站和关键依赖的可用性、近期检查及事件记录。</p>
          </div>
          <div class="check-stamp"><span class="pulse-dot" aria-hidden="true"></span> 每分钟检查一次</div>
        </div>

        <section id="overall" class="overall pending" aria-label="当前整体状态" aria-live="polite">
          <span class="overall-icon" aria-hidden="true">…</span>
          <div class="overall-text">
            <h2 id="overall-title">正在读取运行状态</h2>
            <p id="overall-description">连接状态服务中。</p>
          </div>
          <div class="overall-meta"><span>最近一次检查</span><strong id="last-check">—</strong></div>
        </section>

        <section id="services" class="service-section" aria-labelledby="services-title">
          <div class="section-heading">
            <div><p class="eyebrow">MONITORED SERVICES</p><h2 id="services-title">服务概览</h2></div>
            <div class="history-key"><span class="key-swatch"></span> 近 30 天检查记录</div>
          </div>
          <div id="service-groups" class="service-groups"><p class="loading">正在加载监控记录…</p></div>
          <div class="history-axis"><span>30 天前</span><span>今天</span></div>
        </section>

        <section id="incidents" class="incident-section" aria-labelledby="incidents-title">
          <div class="section-heading">
            <div><p class="eyebrow">INCIDENT HISTORY</p><h2 id="incidents-title">近期事件</h2></div>
            <span class="incident-period">最近 30 天</span>
          </div>
          <div id="incident-list" class="incident-list"><p class="loading">正在加载事件记录…</p></div>
        </section>
      </main>

      <footer class="site-footer"><span>VIPRPG 服务状态</span><span>所有时间以北京时间（UTC+8）显示</span></footer>
    </div>
  </body>
</html>
