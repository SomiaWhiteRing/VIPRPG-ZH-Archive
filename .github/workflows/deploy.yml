name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'status/**'
      - '.github/workflows/status-deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: staging
        type: choice
        options: [staging, production]
      apply_migrations:
        description: Also approve the candidate's pending production D1 migrations
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && 'production-maintenance' || 'deploy-staging' }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Isolated verification configuration
        run: node scripts/prepare-verification-config.mjs
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:flow
      - name: Production candidate summary
        if: inputs.target == 'production'
        run: node scripts/release-summary.mjs
        env:
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}

  staging:
    needs: candidate
    if: github.event_name == 'push' || inputs.target == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore staging configuration
        run: node scripts/prepare-wrangler-config.mjs --env staging
        env:
          WRANGLER_CONFIG_JSONC: ${{ secrets.WRANGLER_CONFIG_JSONC }}
      - run: npm run deploy:staging -- --apply-migrations
      - run: npm run smoke:staging
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}

  production:
    needs: candidate
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Manual production dispatch is the confirmation; no Environment review gate.
    environment:
      name: production
      url: https://viprpg.org
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require production credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
      - name: Restore production configuration
        run: node scripts/prepare-wrangler-config.mjs --env production
        env:
          WRANGLER_CONFIG_JSONC: ${{ secrets.PRODUCTION_WRANGLER_CONFIG_JSONC }}
      - name: Deploy approved candidate
        shell: bash
        env:
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
        run: |
          args=(--confirm viprpg.org)
          if [[ "$APPLY_MIGRATIONS" == 'true' ]]; then args+=(--apply-migrations); fi
          npm run deploy:production -- "${args[@]}"
      - run: npm run smoke:production
