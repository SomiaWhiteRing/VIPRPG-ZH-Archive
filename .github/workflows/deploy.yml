name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'status/**'
      - '.github/workflows/status-deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && 'production-maintenance' || 'deploy-staging' }}
  queue: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && 'max' || 'single' }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && github.ref == 'refs/heads/codex/deployment-speed')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Isolated verification configuration
        run: node scripts/prepare-verification-config.mjs
      - run: npm run check
      - run: npx tsx scripts/crawl-policy-check.ts
      - run: npx tsx scripts/archive-performance-check.ts
      - run: npm run test:timeline

  candidate:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && github.ref == 'refs/heads/codex/deployment-speed')
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
      # Both host and container use Ubuntu 24.04. Reuse the runner's compression
      # tools instead of installing packages in the release path.
      volumes:
        - /usr/bin/zstd:/usr/local/bin/zstd:ro
        - /usr/bin/zstdmt:/usr/local/bin/zstdmt:ro
        - /usr/bin/unzstd:/usr/local/bin/unzstd:ro
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Isolated verification configuration
        run: node scripts/prepare-verification-config.mjs
      - name: Verify preinstalled browser
        run: |
          node --input-type=module -e "import { chromium } from 'playwright'; const browser = await chromium.launch({ headless: true }); await browser.close();"
      - run: npm run test:flow -- --report output/system-self-check/flow.json
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-self-check-failure
          path: |
            output/system-self-check/
            /tmp/viprpg-system-test-*/failure.*
            /tmp/viprpg-system-test-*/browser-errors.json
            /tmp/viprpg-system-test-*/*.log
          retention-days: 7
      - name: Production candidate summary
        if: inputs.target == 'production'
        run: node scripts/release-summary.mjs

  staging:
    needs: [checks, candidate]
    if: github.event_name == 'push' || inputs.target == 'staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Restore staging configuration
        run: node scripts/prepare-wrangler-config.mjs --env staging
        env:
          WRANGLER_CONFIG_JSONC: ${{ secrets.WRANGLER_CONFIG_JSONC }}
      - run: npm run deploy:staging -- --apply-migrations
      - run: npm run smoke:staging
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}

  production:
    needs: [checks, candidate]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Manual production dispatch is the confirmation; no Environment review gate.
    environment:
      name: production
      url: https://viprpg.org
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Require production credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
      - name: Restore production configuration
        run: node scripts/prepare-wrangler-config.mjs --env production
        env:
          WRANGLER_CONFIG_JSONC: ${{ secrets.PRODUCTION_WRANGLER_CONFIG_JSONC }}
          GA_ENABLED: ${{ vars.GA_ENABLED || 'false' }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          GA_GATEWAY_PATH: ${{ vars.GA_GATEWAY_PATH }}
      - name: Deploy approved candidate
        run: npm run deploy:production -- --apply-migrations --confirm viprpg.org
      - run: npm run smoke:production
