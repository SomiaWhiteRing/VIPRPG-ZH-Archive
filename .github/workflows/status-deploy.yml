name: Deploy Status

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit --project status/tsconfig.json
      - name: Candidate summary
        run: |
          printf 'Status candidate: %s\n\nPending D1 migrations will be detected and applied automatically before deployment.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          sha256sum status/migrations/*.sql >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: status
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STATUS_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STATUS_D1_DATABASE_ID: ${{ secrets.STATUS_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node status/scripts/sync-brand-asset.mjs
      - run: node status/scripts/set-d1-id.mjs
      - name: Detect and apply pending status D1 migrations
        run: npx wrangler d1 migrations apply STATUS_DB --remote --config status/wrangler.status.jsonc
      - name: Deploy status Worker
        run: npx wrangler deploy --config status/wrangler.status.jsonc
      - name: Verify live service
        run: |
          curl --fail --silent --show-error --max-time 30 https://status.viprpg.org/ > /dev/null
          curl --fail --silent --show-error --max-time 30 https://status.viprpg.org/api/health | jq -e '.ok == true'
          curl --fail --silent --show-error --max-time 30 https://status.viprpg.org/api/status | jq -e '[.monitors[].id] | index("production-web") != null'
