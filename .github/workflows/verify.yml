name: Verify migration

on:
  pull_request:
  workflow_dispatch:
    inputs:
      runtime_environment:
        description: Runtime diagnostic target
        type: choice
        options: [staging, production]
        default: staging
      runtime_work_id:
        description: Public game used for runtime diagnostics
        type: number
        default: 1

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-delivery:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RUNTIME_ENVIRONMENT: ${{ inputs.runtime_environment || 'staging' }}
      RUNTIME_WORK_ID: ${{ inputs.runtime_work_id || 1 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: Verify deployed runtime bytes and record transfer time
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { deploymentOrigins } from './scripts/deployment-config.mjs';
          const { version } = JSON.parse(readFileSync('lib/archive/easyrpg-runtime.json', 'utf8'));
          const origin = deploymentOrigins[process.env.RUNTIME_ENVIRONMENT];
          if (!origin) throw new Error('Unknown runtime diagnostic target');
            await Promise.all(['wasm', 'data'].map(async (extension) => {
              const path = `/play/runtime/easyrpg/${version}/easyrpg-player.${extension}`;
              const expected = readFileSync(`public${path}`);
              const start = performance.now();
              const response = await fetch(origin + path, {
                headers: { 'Accept-Encoding': 'br' }, signal: AbortSignal.timeout(60000),
              });
              const headersMs = performance.now() - start;
              const body = Buffer.from(await response.arrayBuffer());
              const identical = body.equals(expected);
              console.log(JSON.stringify({ origin, extension, status: response.status,
                encoding: response.headers.get('content-encoding'), ray: response.headers.get('cf-ray'),
                headersMs, totalMs: performance.now() - start, bytes: body.length, identical }));
              if (!response.ok || !identical) throw new Error(`Runtime delivery mismatch: ${origin}${path}`);
            }));
          NODE
      - name: Verify cold startup, hydration and warm cache
        run: node scripts/easyrpg-cold-start-check.mjs --env "$RUNTIME_ENVIRONMENT" --work-id "$RUNTIME_WORK_ID"
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
      - name: Compare startup over HTTP/2
        run: node scripts/easyrpg-cold-start-check.mjs --env "$RUNTIME_ENVIRONMENT" --work-id "$RUNTIME_WORK_ID" --disable-quic --report output/easyrpg/cold-start-http2.json
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
      - name: Preserve runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-cold-start
          path: output/easyrpg/cold-start*
          retention-days: 7
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify bounded player console
        run: node scripts/console-scrollback-check.mjs
      - name: Use isolated local configuration
        run: node scripts/prepare-verification-config.mjs
      - run: npm run check
      - name: Verify archive cleanup safety
        run: |
          npx tsx scripts/archive-gc-check.ts
          npx tsx scripts/manual-gc-check.ts
      - run: npm run test:forum
      - run: npm run test:timeline
      - run: npx playwright install --with-deps chromium
      - run: npm run test:flow -- --report output/system-self-check/flow.json
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-self-check-failure
          path: |
            output/system-self-check/
            /tmp/viprpg-system-test-*/failure.*
            /tmp/viprpg-system-test-*/browser-errors.json
            /tmp/viprpg-system-test-*/*.log
          retention-days: 7
