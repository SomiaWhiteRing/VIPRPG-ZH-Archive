name: Verify migration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use isolated local configuration
        run: node scripts/prepare-verification-config.mjs
      - run: npm run check
      - name: Verify archive cleanup safety
        run: |
          npx tsx scripts/archive-gc-check.ts
          npx tsx scripts/manual-gc-check.ts
      - run: npm run test:forum
      - run: npm run test:timeline
      - run: npx playwright install --with-deps chromium
      - run: npm run test:flow -- --report output/system-self-check/flow.json
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-self-check-failure
          path: |
            output/system-self-check/
            /tmp/viprpg-system-test-*/failure.*
            /tmp/viprpg-system-test-*/browser-errors.json
            /tmp/viprpg-system-test-*/*.log
          retention-days: 7
