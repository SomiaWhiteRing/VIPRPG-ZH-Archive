name: Android Release

on:
  push:
    branches: [main]
    # Keep shared imports and Tailwind sources in sync with android/web and the build scripts.
    paths:
      - '.github/workflows/android.yml'
      - 'android/**'
      - '!android/**/*.md'
      - 'scripts/build-android-assets.mjs'
      - 'scripts/style-namespace.mjs'
      - 'scripts/android-runtime-adapter.mjs'
      - 'scripts/inspect-android-package.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.gitignore'
      - 'tsconfig.json'
      - 'postcss.config.mjs'
      - 'app/shared.css'
      - 'app/components/ui/button.tsx'
      - 'app/components/ui/input.tsx'
      - 'app/components/ui/dialog.tsx'
      - 'app/play/player.css'
      - 'app/play/*/web-play-controls-preferences.ts'
      - 'app/play/*/web-play-cover.ts'
      - 'app/play/*/web-play-db.ts'
      - 'app/play/*/web-play-events.ts'
      - 'app/play/*/web-play-install-observer.ts'
      - 'app/play/*/web-play-layout-editor.tsx'
      - 'app/play/*/web-play-keyboard.tsx'
      - 'app/play/*/web-play-keyboard-keys.ts'
      - 'app/play/*/web-play-locks.ts'
      - 'app/play/*/web-play-opfs.ts'
      - 'app/play/*/web-play-player.ts'
      - 'app/play/*/web-play-player-config.ts'
      - 'app/play/*/web-play-player-worker.ts'
      - 'app/play/*/web-play-bundled-saves.ts'
      - 'app/play/*/web-play-save-transfer.ts'
      - 'app/play/*/web-play-save-upgrade.ts'
      - 'app/play/*/web-play-screenshot-db.ts'
      - 'app/play/*/web-play-screenshots.ts'
      - 'app/play/*/web-play-storage.ts'
      - 'app/play/*/web-play-surface.tsx'
      - 'app/play/*/web-play-types.ts'
      - 'lib/archive/download.ts'
      - 'lib/archive/crc32.ts'
      - 'lib/archive/easyrpg-runtime.json'
      - 'lib/archive/lsd-save-upgrade.ts'
      - 'lib/archive/web-play.ts'
      - 'lib/browser/client-environment.ts'
      - 'lib/browser/android-screenshots.ts'
      - 'lib/browser/android-local.ts'
      - 'lib/browser/work-play.ts'
      - 'lib/format.ts'
      - 'lib/ui/api-response.ts'
      - 'lib/ui/cn.ts'
      - 'lib/android-package.ts'
      - 'lib/package-zip.ts'
      - 'lib/resource-limits.ts'
      - 'public/play/**'
      - 'public/icon/windI.png'
  workflow_dispatch:
    inputs:
      target:
        description: APK site and release channel
        required: true
        default: staging
        type: choice
        options: [staging, production]
      draft:
        description: Keep the verified APK as an unpublished release draft
        required: true
        default: false
        type: boolean
      version_name:
        description: APK version name (X.Y.Z); leave blank for automatic numbering
        required: false
        type: string

permissions:
  contents: read

# Queue automatic builds so each one sees the previous automatic release.
concurrency:
  group: ${{ inputs.target == 'production' && 'production-maintenance' || github.event_name == 'push' && 'android-automatic' || format('android-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version_code: ${{ steps.release.outputs.version_code }}
      version_name: ${{ steps.release.outputs.version_name }}
      published: ${{ steps.release.outputs.published }}
    permissions:
      actions: read
      contents: read
    env:
      GH_REPO: ${{ github.repository }}
      # Production is manual and owner-approved; pushes continue to build staging.
      SITE_ORIGIN: ${{ inputs.target == 'production' && 'https://viprpg.org' || 'https://staging.viprpg.org' }}
      RELEASE_TARGET: ${{ inputs.target == 'production' && 'production' || 'staging' }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare release identity
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          code=$((100000 + GITHUB_RUN_NUMBER))
          tag="android-${RELEASE_TARGET}-${code}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          # Published assets stay immutable, including when a workflow is rerun.
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft) && [[ "$draft" == false ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${REQUESTED_VERSION_NAME:-0.3.${GITHUB_RUN_NUMBER}}"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            previous_run=$(gh run list --workflow android.yml --branch main --event push --status success --limit 1 --json number --jq '.[0].number // empty')
            version="0.3.1"
            if [[ -n "$previous_run" ]]; then
              previous_tag="android-staging-$((100000 + previous_run))"
              previous_release=$(gh release view "$previous_tag" --json name,isDraft --jq 'select(.isDraft | not) | .name')
              if [[ ! "$previous_release" =~ ^Android\ ([0-9]+\.[0-9]+)\.([0-9]+)\ \(staging\)$ ]]; then
                echo "Cannot read the automatic APK version from $previous_tag" >&2
                exit 1
              fi
              version="${BASH_REMATCH[1]}.$((10#${BASH_REMATCH[2]} + 1))"
            fi
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'version_name must use X.Y.Z format' >&2
            exit 1
          fi
          echo "ANDROID_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "version_name=$version" >> "$GITHUB_OUTPUT"

      - name: Restore fixed signing key
        if: steps.release.outputs.published != 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Configure ANDROID_KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Configure ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Configure ANDROID_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Configure ANDROID_KEY_PASSWORD}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/archive.jks"

      - name: Set up Node.js
        if: steps.release.outputs.published != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        if: steps.release.outputs.published != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: steps.release.outputs.published != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install Android SDK components
        if: steps.release.outputs.published != 'true'
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'

      - name: Build signed APK
        if: steps.release.outputs.published != 'true'
        run: bash android/build-apk.sh release
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/archive.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify package and record checksum
        if: steps.release.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" verify --verbose output/android/viprpg-release.apk
          expected=$(openssl x509 -in android/release-certificate.pem -outform DER | sha256sum | cut -d ' ' -f 1)
          actual=$("$signer" verify --print-certs output/android/viprpg-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [[ "$actual" == "$expected" ]] || { echo 'Release signing certificate does not match'; exit 1; }
          node --import tsx scripts/inspect-android-package.ts output/android/viprpg-release.apk
          cd output/android
          sha256sum viprpg-release.apk > SHA256SUMS.txt

      - name: Save release artifacts
        if: steps.release.outputs.published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: viprpg-android-${{ env.RELEASE_TARGET }}-${{ env.ANDROID_VERSION_CODE }}
          path: |
            output/android/viprpg-release.apk
            output/android/SHA256SUMS.txt
          if-no-files-found: error

      - name: Candidate summary
        if: steps.release.outputs.published != 'true'
        shell: bash
        run: |
          printf 'Android candidate: %s (%s)\n\nCommit: %s\n\nOrigin: %s\n\n' "$ANDROID_VERSION_NAME" "$RELEASE_TARGET" "$GITHUB_SHA" "$SITE_ORIGIN" >> "$GITHUB_STEP_SUMMARY"
          cat output/android/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/archive.jks"

  publish:
    needs: build
    if: needs.build.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target == 'production' && 'production' || 'staging' }}
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      SITE_ORIGIN: ${{ inputs.target == 'production' && 'https://viprpg.org' || 'https://staging.viprpg.org' }}
      RELEASE_TARGET: ${{ inputs.target == 'production' && 'production' || 'staging' }}
      ANDROID_VERSION_CODE: ${{ needs.build.outputs.version_code }}
      ANDROID_VERSION_NAME: ${{ needs.build.outputs.version_name }}
    steps:
      - name: Download the verified APK candidate
        uses: actions/download-artifact@v4
        with:
          name: viprpg-android-${{ env.RELEASE_TARGET }}-${{ env.ANDROID_VERSION_CODE }}
          path: output/android
      - name: Verify downloaded candidate
        working-directory: output/android
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/android-release.md"
          printf 'Android %s (%s)\n\nCommit: %s\n\n站点：%s\n\n下载 viprpg-release.apk。此包使用固定发布签名；可覆盖安装较早的同签名版本。更换站点来源后，旧来源的离线安装与存档不会自动迁移。网站更新频道仍须单独发布。\n\n' "$ANDROID_VERSION_NAME" "$RELEASE_TARGET" "$GITHUB_SHA" "$SITE_ORIGIN" > "$notes"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" --jq .body >> "$notes"
          if release=$(gh release view "$RELEASE_TAG" --json isDraft); then
            # A maintainer may have published the draft while the build was running.
            [[ "$(jq -r .isDraft <<< "$release")" == true ]] || exit 0
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease \
              --title "Android $ANDROID_VERSION_NAME ($RELEASE_TARGET)" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" output/android/viprpg-release.apk output/android/SHA256SUMS.txt --clobber
          prerelease=true
          if [[ "$RELEASE_TARGET" == 'production' ]]; then prerelease=false; fi
          gh release edit "$RELEASE_TAG" \
            --draft="${{ inputs.draft == true && 'true' || 'false' }}" \
            --prerelease="$prerelease" \
            --latest="${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && inputs.draft != true && 'true' || 'false' }}" \
            --notes-file "$notes"
