<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色素材审核</title>
<link rel="stylesheet" href="/styles.css">
<body class="box-border m-0 bg-[#f6f5f1] text-[#252922] [font:14px/1.5_system-ui,sans-serif] [&_*]:box-border [&_button]:[font:inherit] [&_input]:[font:inherit] [&_select]:[font:inherit] [&_:is(button,select,input)]:border [&_:is(button,select,input)]:border-solid [&_:is(button,select,input)]:border-[#b6bcb1] [&_:is(button,select,input)]:rounded-[4px] [&_:is(button,select,input)]:p-[7px] [&_:is(button,select,input)]:bg-white [&_:is(button,select,input)]:text-inherit [&_button]:cursor-pointer [&_button:hover]:bg-[#e6ecdf] [&_button:disabled]:opacity-50 [&_button:disabled]:cursor-wait [&_button.active]:border-[#416342] [&_button.active]:bg-[#e4eddf] [&_a]:text-[#365c38] [&_aside]:p-3.5 [&_aside]:overflow-auto [&_aside]:border-r [&_aside]:border-r-solid [&_aside]:border-r-[#ccd0c5] [&_aside:last-child]:border-r-0 [&_aside:last-child]:border-l [&_aside:last-child]:border-l-solid [&_aside:last-child]:border-l-[#ccd0c5] [&_h2]:text-[17px] [&_h2]:mt-0 [&_h2]:mb-2">
<header class="flex flex-wrap items-center gap-3 border-b border-b-solid border-b-[#ccd0c5] px-5 py-3.5"><h1 class="m-0 text-[20px]">角色素材审核</h1><span id="progress" class="mr-auto"></span><button id="build">生成初始化清单</button></header>
<header class="flex flex-wrap items-center gap-3 border-b border-b-solid border-b-[#ccd0c5] px-5 py-3.5"><select id="reason"><option value="">全部原因</option><option value="collective_scope">多人／共通</option><option value="multiple_candidates">多个候选</option><option value="conflicting_anchors">分类冲突</option></select><select id="state"><option value="pending">未处理</option><option value="skip">暂跳过</option><option value="assign">已关联</option><option value="reject">已舍弃</option><option value="all">全部</option></select><input id="search" placeholder="搜索页面、栏目"><button id="next">下一未处理栏目</button></header>
<div id="message" class="min-h-8 px-5 py-1.5 text-[#416342]" role="status"></div><div class="grid h-[calc(100vh-130px)] grid-cols-[260px_minmax(400px,1fr)_320px] [@media(max-width:1000px)]:h-auto [@media(max-width:1000px)]:grid-cols-[210px_1fr] [@media(max-width:1000px)]:[&>aside:last-child]:col-[1/-1]"><aside id="groups" class="[&_button]:mb-1.5 [&_button]:block [&_button]:w-full [&_button]:text-left"></aside><main class="overflow-auto p-3.5"><h2 id="title"></h2><div id="context"></div><div class="my-3 flex flex-wrap gap-2"><button id="all">选择本栏全部</button><button id="clear">清除选择</button><span id="selection"></span></div><div class="grid grid-cols-[repeat(auto-fill,minmax(120px,1fr))] gap-2" id="images"></div></main><aside><div class="flex h-[290px] items-center justify-center [background:repeating-conic-gradient(#eee_0%_25%,#fff_0%_50%)_0/20px_20px] [&_img]:max-h-full [&_img]:max-w-full [&_img]:object-contain [&_img]:[image-rendering:pixelated]" id="preview"></div><p class="break-all" id="filename"></p><h2>关联角色</h2><input id="characterSearch" placeholder="角色名、原名、别名"><div id="characterResults" class="max-h-[220px] overflow-auto [&_label]:block [&_label]:p-1"></div><p id="chosen" class="whitespace-pre-line"></p><div class="my-3 flex flex-wrap gap-2"><button id="assign">保存关联</button><button id="reject">舍弃</button><button id="skip">暂跳过</button><button id="reset">撤销处理</button></div><h2>同栏目已分类脸图</h2><div class="flex gap-1.5 overflow-auto [&_img]:size-[110px] [&_img]:object-contain [&_img]:[image-rendering:pixelated]" id="faces"></div><div id="evidence" class="text-xs text-[#666d60]"></div></aside></div>
<script>
let data,groups=[],current,selected=new Set(),names=new Set(),busy=false;
const $=id=>document.getElementById(id),reasonLabels={collective_scope:'多人／共通',multiple_candidates:'多个候选',conflicting_anchors:'分类冲突'},kinds={charset:'行走图',monster:'モングラ',other:'其他'};
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node}
function image(file){const node=el('img');node.src='/image/'+encodeURIComponent(file);node.loading='lazy';return node}
function state(item){return data.decisions[item.id]?.action||'pending'}
function visible(g){return g.items.some(x=>$('state').value==='all'||state(x)===$('state').value)&&(!$('reason').value||g.status===$('reason').value)&&g.label.toLowerCase().includes($('search').value.toLowerCase())}
function renderGroups(){const counts={};data.items.forEach(x=>counts[state(x)]=(counts[state(x)]||0)+1);$('progress').textContent=`共 ${data.items.length} 项 · 未处理 ${counts.pending||0} · 关联 ${counts.assign||0} · 舍弃 ${counts.reject||0} · 跳过 ${counts.skip||0}`;$('groups').replaceChildren();for(const g of groups.filter(visible)){const b=el('button',g.label+' · '+g.items.length);if(g===current)b.className='active';b.onclick=()=>open(g);$('groups').append(b)}}
function open(g){current=g;selected.clear();names.clear();$('chosen').textContent='';$('preview').replaceChildren();$('filename').textContent='';renderGroups();$('title').textContent=g.label;$('context').replaceChildren();const a=el('a','来源页面');a.href=g.pageUrl;a.target='_blank';a.rel='noreferrer';$('context').append(a,el('span',' · '+reasonLabels[g.status],'text-[#7b4f19]'));renderImages();const scope=data.scopes.find(s=>s.pageUrl===g.pageUrl&&JSON.stringify(s.path)===JSON.stringify(g.scope));$('faces').replaceChildren();for(const f of scope?.faces||[]){const n=image('faces/'+f.sha256+'.png');n.title=f.names.join('、');$('faces').append(n)}$('evidence').textContent='脸图角色：'+[...new Set((scope?.faces||[]).flatMap(f=>f.names))].join('、');renderCharacters()}
function renderImages(){$('images').replaceChildren();for(const x of current?.items||[]){const card=el('div',undefined,'overflow-hidden border border-solid border-[#c5cbbf] p-1.5 [&_img]:w-full [&_img]:h-[110px] [&_img]:object-contain [&_img]:[image-rendering:pixelated] [&_img]:bg-[#e7e7e7] [&_small]:block [&_small]:break-all'+(selected.has(x.id)?' outline-2 outline-solid outline-[#426646]':''));const checkbox=el('input');checkbox.type='checkbox';checkbox.checked=selected.has(x.id);checkbox.ariaLabel='选择 '+x.filename;checkbox.onchange=()=>{if(checkbox.checked)selected.add(x.id);else selected.delete(x.id);renderImages()};const pic=image(x.file);pic.onclick=()=>{$('preview').replaceChildren(image(x.file));$('filename').textContent=x.filename+' · '+kinds[x.kind];names=new Set(data.decisions[x.id]?.names||[]);renderCharacters()};card.append(checkbox,pic,el('small',kinds[x.kind]+' · '+({pending:'未处理',assign:'已关联',reject:'已舍弃',skip:'暂跳过'}[state(x)])),el('small',x.filename));$('images').append(card)}$('selection').textContent=`已选 ${selected.size} 项`}
function renderCharacters(){$('characterResults').replaceChildren();const q=$('characterSearch').value.toLowerCase();const candidates=current?.items.flatMap(x=>x.candidates)||[];const list=data.characters.filter(c=>q?[c.originalName,c.primaryName,...c.aliases.map(a=>a.name)].some(n=>n.toLowerCase().includes(q)):candidates.includes(c.originalName)||names.has(c.originalName));for(const c of list){const label=el('label'),input=el('input');input.type='checkbox';input.checked=names.has(c.originalName);input.onchange=()=>{if(input.checked)names.add(c.originalName);else names.delete(c.originalName);$('chosen').textContent=[...names].join('、')};label.append(input,document.createTextNode(c.primaryName+' / '+c.originalName));$('characterResults').append(label)}$('chosen').textContent=[...names].join('、')}
async function post(url,payload){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const value=await response.json();if(!response.ok)throw Error(value.error);return value}
async function decide(action){if(busy)return;if(!selected.size){$('message').textContent='先选择素材';return}if(action==='assign'&&!names.size){$('message').textContent='请选择关联角色';return}busy=true;try{const result=await post('/decisions',{ids:[...selected],action,names:[...names]});data.decisions=result.decisions;$('message').textContent='已保存到本地';renderImages();renderGroups()}catch(e){$('message').textContent=e.message}finally{busy=false}}
for(const action of ['assign','reject','skip','reset'])$(action).onclick=()=>decide(action);
$('all').onclick=()=>{for(const x of current?.items||[])selected.add(x.id);renderImages()};$('clear').onclick=()=>{selected.clear();renderImages()};
for(const id of ['reason','state','search'])$(id).oninput=renderGroups;
$('characterSearch').oninput=renderCharacters;
$('next').onclick=()=>{const start=groups.indexOf(current);for(let i=1;i<=groups.length;i++){const g=groups[(start+i)%groups.length];if(g.items.some(x=>state(x)==='pending')){open(g);return}}$('message').textContent='没有未处理栏目'};
$('build').onclick=async()=>{if(busy)return;busy=true;$('build').disabled=true;$('message').textContent='正在校验素材并生成清单…';try{const r=await post('/build',{});$('message').textContent=`清单已生成：${r.materials} 个素材、${r.bindings} 条角色绑定，待审核 ${r.pending} 项`}catch(e){$('message').textContent=e.message}finally{busy=false;$('build').disabled=false}};
fetch('/data').then(r=>r.json()).then(value=>{data=value;const map=new Map();for(const item of data.items){const key=JSON.stringify([item.pageUrl,item.scope]);if(!map.has(key))map.set(key,{pageUrl:item.pageUrl,scope:item.scope,status:item.status,label:[item.pageTitle,...item.scope].join(' / '),items:[]});map.get(key).items.push(item)}groups=[...map.values()];renderGroups();if(groups.length)open(groups.find(g=>g.items.some(x=>state(x)==='pending'))||groups[0])}).catch(e=>$('message').textContent=e.message);
</script></body></html>
