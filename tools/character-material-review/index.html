<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色素材审核</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#252922;font:14px/1.5 system-ui,sans-serif}button,input,select{font:inherit}button,select,input{border:1px solid #b6bcb1;border-radius:4px;padding:7px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#e6ecdf}button:disabled{opacity:.5;cursor:wait}header{padding:14px 20px;border-bottom:1px solid #ccd0c5;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}#progress{margin-right:auto}.layout{display:grid;grid-template-columns:260px minmax(400px,1fr) 320px;height:calc(100vh - 130px)}aside,main{padding:14px;overflow:auto}aside{border-right:1px solid #ccd0c5}aside:last-child{border-right:0;border-left:1px solid #ccd0c5}#groups button{display:block;width:100%;text-align:left;margin-bottom:6px}button.active{border-color:#416342;background:#e4eddf}h2{font-size:17px;margin:0 0 8px}.muted{color:#666d60;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.tile{border:1px solid #c5cbbf;padding:6px;overflow:hidden}.tile img{width:100%;height:110px;object-fit:contain;image-rendering:pixelated;background:#e7e7e7}.tile.selected{outline:2px solid #426646}.tile small{display:block;word-break:break-all}.preview{height:290px;background:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 0/20px 20px;display:flex;align-items:center;justify-content:center}.preview img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated}#characterResults label{display:block;padding:4px}#characterResults{max-height:220px;overflow:auto}.faces{display:flex;gap:6px;overflow:auto}.faces img{width:110px;height:110px;object-fit:contain;image-rendering:pixelated}#message{padding:6px 20px;min-height:32px;color:#416342}a{color:#365c38}.name{word-break:break-all}#chosen{white-space:pre-line}.reason{color:#7b4f19}@media(max-width:1000px){.layout{grid-template-columns:210px 1fr;height:auto}.layout>aside:last-child{grid-column:1/-1}header{position:static}}
</style>
<header><h1>角色素材审核</h1><span id="progress"></span><button id="build">生成初始化清单</button></header>
<header><select id="reason"><option value="">全部原因</option><option value="collective_scope">多人／共通</option><option value="multiple_candidates">多个候选</option><option value="conflicting_anchors">分类冲突</option></select><select id="state"><option value="pending">未处理</option><option value="skip">暂跳过</option><option value="assign">已关联</option><option value="reject">已舍弃</option><option value="all">全部</option></select><input id="search" placeholder="搜索页面、栏目"><button id="next">下一未处理栏目</button></header>
<div id="message" role="status"></div><div class="layout"><aside id="groups"></aside><main><h2 id="title"></h2><div id="context"></div><div class="toolbar"><button id="all">选择本栏全部</button><button id="clear">清除选择</button><span id="selection"></span></div><div class="grid" id="images"></div></main><aside><div class="preview" id="preview"></div><p class="name" id="filename"></p><h2>关联角色</h2><input id="characterSearch" placeholder="角色名、原名、别名"><div id="characterResults"></div><p id="chosen"></p><div class="toolbar"><button id="assign">保存关联</button><button id="reject">舍弃</button><button id="skip">暂跳过</button><button id="reset">撤销处理</button></div><h2>同栏目已分类脸图</h2><div class="faces" id="faces"></div><div id="evidence" class="muted"></div></aside></div>
<script>
let data,groups=[],current,selected=new Set(),names=new Set(),busy=false;
const $=id=>document.getElementById(id),reasonLabels={collective_scope:'多人／共通',multiple_candidates:'多个候选',conflicting_anchors:'分类冲突'},kinds={charset:'行走图',monster:'モングラ',other:'其他'};
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node}
function image(file){const node=el('img');node.src='/image/'+encodeURIComponent(file);node.loading='lazy';return node}
function state(item){return data.decisions[item.id]?.action||'pending'}
function visible(g){return g.items.some(x=>$('state').value==='all'||state(x)===$('state').value)&&(!$('reason').value||g.status===$('reason').value)&&g.label.toLowerCase().includes($('search').value.toLowerCase())}
function renderGroups(){const counts={};data.items.forEach(x=>counts[state(x)]=(counts[state(x)]||0)+1);$('progress').textContent=`共 ${data.items.length} 项 · 未处理 ${counts.pending||0} · 关联 ${counts.assign||0} · 舍弃 ${counts.reject||0} · 跳过 ${counts.skip||0}`;$('groups').replaceChildren();for(const g of groups.filter(visible)){const b=el('button',g.label+' · '+g.items.length);if(g===current)b.className='active';b.onclick=()=>open(g);$('groups').append(b)}}
function open(g){current=g;selected.clear();names.clear();$('chosen').textContent='';$('preview').replaceChildren();$('filename').textContent='';renderGroups();$('title').textContent=g.label;$('context').replaceChildren();const a=el('a','来源页面');a.href=g.pageUrl;a.target='_blank';a.rel='noreferrer';$('context').append(a,el('span',' · '+reasonLabels[g.status],'reason'));renderImages();const scope=data.scopes.find(s=>s.pageUrl===g.pageUrl&&JSON.stringify(s.path)===JSON.stringify(g.scope));$('faces').replaceChildren();for(const f of scope?.faces||[]){const n=image('faces/'+f.sha256+'.png');n.title=f.names.join('、');$('faces').append(n)}$('evidence').textContent='脸图角色：'+[...new Set((scope?.faces||[]).flatMap(f=>f.names))].join('、');renderCharacters()}
function renderImages(){$('images').replaceChildren();for(const x of current?.items||[]){const card=el('div',undefined,'tile'+(selected.has(x.id)?' selected':''));const checkbox=el('input');checkbox.type='checkbox';checkbox.checked=selected.has(x.id);checkbox.ariaLabel='选择 '+x.filename;checkbox.onchange=()=>{if(checkbox.checked)selected.add(x.id);else selected.delete(x.id);renderImages()};const pic=image(x.file);pic.onclick=()=>{$('preview').replaceChildren(image(x.file));$('filename').textContent=x.filename+' · '+kinds[x.kind];names=new Set(data.decisions[x.id]?.names||[]);renderCharacters()};card.append(checkbox,pic,el('small',kinds[x.kind]+' · '+({pending:'未处理',assign:'已关联',reject:'已舍弃',skip:'暂跳过'}[state(x)])),el('small',x.filename));$('images').append(card)}$('selection').textContent=`已选 ${selected.size} 项`}
function renderCharacters(){$('characterResults').replaceChildren();const q=$('characterSearch').value.toLowerCase();const candidates=current?.items.flatMap(x=>x.candidates)||[];const list=data.characters.filter(c=>q?[c.originalName,c.primaryName,...c.aliases.map(a=>a.name)].some(n=>n.toLowerCase().includes(q)):candidates.includes(c.originalName)||names.has(c.originalName));for(const c of list){const label=el('label'),input=el('input');input.type='checkbox';input.checked=names.has(c.originalName);input.onchange=()=>{if(input.checked)names.add(c.originalName);else names.delete(c.originalName);$('chosen').textContent=[...names].join('、')};label.append(input,document.createTextNode(c.primaryName+' / '+c.originalName));$('characterResults').append(label)}$('chosen').textContent=[...names].join('、')}
async function post(url,payload){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const value=await response.json();if(!response.ok)throw Error(value.error);return value}
async function decide(action){if(busy)return;if(!selected.size){$('message').textContent='先选择素材';return}if(action==='assign'&&!names.size){$('message').textContent='请选择关联角色';return}busy=true;try{const result=await post('/decisions',{ids:[...selected],action,names:[...names]});data.decisions=result.decisions;$('message').textContent='已保存到本地';renderImages();renderGroups()}catch(e){$('message').textContent=e.message}finally{busy=false}}
for(const action of ['assign','reject','skip','reset'])$(action).onclick=()=>decide(action);
$('all').onclick=()=>{for(const x of current?.items||[])selected.add(x.id);renderImages()};$('clear').onclick=()=>{selected.clear();renderImages()};
for(const id of ['reason','state','search'])$(id).oninput=renderGroups;
$('characterSearch').oninput=renderCharacters;
$('next').onclick=()=>{const start=groups.indexOf(current);for(let i=1;i<=groups.length;i++){const g=groups[(start+i)%groups.length];if(g.items.some(x=>state(x)==='pending')){open(g);return}}$('message').textContent='没有未处理栏目'};
$('build').onclick=async()=>{if(busy)return;busy=true;$('build').disabled=true;$('message').textContent='正在校验素材并生成清单…';try{const r=await post('/build',{});$('message').textContent=`清单已生成：${r.materials} 个素材、${r.bindings} 条角色绑定，待审核 ${r.pending} 项`}catch(e){$('message').textContent=e.message}finally{busy=false;$('build').disabled=false}};
fetch('/data').then(r=>r.json()).then(value=>{data=value;const map=new Map();for(const item of data.items){const key=JSON.stringify([item.pageUrl,item.scope]);if(!map.has(key))map.set(key,{pageUrl:item.pageUrl,scope:item.scope,status:item.status,label:[item.pageTitle,...item.scope].join(' / '),items:[]});map.get(key).items.push(item)}groups=[...map.values()];renderGroups();if(groups.length)open(groups.find(g=>g.items.some(x=>state(x)==='pending'))||groups[0])}).catch(e=>$('message').textContent=e.message);
</script></html>
