plugins {
    id 'com.android.application'
}

import groovy.json.JsonSlurper

def siteOrigin = providers.gradleProperty('siteOrigin').getOrElse('https://staging.viprpg.org')
def siteUri = new URI(siteOrigin)
if (siteUri.scheme != 'https' || !siteUri.host || siteUri.port != -1 || siteUri.rawPath || siteUri.rawQuery || siteUri.rawFragment) {
    throw new GradleException('siteOrigin must be an HTTPS origin without a path or port')
}
def runtimeVersion = new JsonSlurper().parse(file('../../lib/archive/easyrpg-runtime.json')).version

android {
    namespace 'org.viprpg.archive'
    compileSdk 35

    defaultConfig {
        applicationId 'org.viprpg.archive'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        buildConfigField 'String', 'SITE_ORIGIN', '"' + siteOrigin + '"'
        buildConfigField 'String', 'RUNTIME_VERSION', '"' + runtimeVersion + '"'
    }

    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDirs += [file('../build-assets')]
    sourceSets.main.res.srcDirs += [file('../build-res')]
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
