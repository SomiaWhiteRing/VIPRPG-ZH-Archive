<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>玉露弹 · 联机大厅</title>
  <link rel="stylesheet" href="/play/gyokuro-lobby/index.css">
  <script src="/play/gyokuro-lobby/runtime/player-host.js" defer></script>
  <script src="/play/gyokuro-lobby/index.js" defer></script>
</head>
<body>
  <main id="lobby">
    <header>
      <p>玉露弹</p>
      <h1>联机大厅</h1>
      <div id="identity"></div>
    </header>
    <p id="status" role="status">正在连接</p>
    <div id="actions">
      <button id="match" disabled>自动匹配</button>
      <button id="create" disabled>创建房间</button>
      <button id="leave" hidden>离开房间</button>
    </div>
    <section id="room" hidden aria-labelledby="room-title">
      <h2 id="room-title">当前房间</h2>
      <ul id="players"></ul>
      <div id="choices">
        <label>角色 <select id="fighter"></select></label>
        <label id="stage-choice">场地 <select id="stage"></select></label>
        <button id="ready">准备</button>
      </div>
    </section>
    <section aria-labelledby="rooms-title">
      <h2 id="rooms-title">房间列表</h2>
      <p id="empty" hidden>暂无房间</p>
      <ul id="rooms"></ul>
    </section>
  </main>
  <section id="battle" hidden aria-label="对战画面">
    <canvas id="canvas" tabindex="0" aria-label="游戏画面"></canvas>
    <footer>
      <span>方向键移动 · Z 攻击</span>
      <button id="quit">离开对战</button>
    </footer>
  </section>
</body>
</html>
